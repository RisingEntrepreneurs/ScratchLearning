<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- iPhone 竖屏适配：禁止缩放、适配刘海屏安全区 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="小小探险家">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8ee">
<!-- 离线网页 App：应用清单 + 桌面图标 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>小小探险家 · 三年级闯关</title>
<style>
/* ========== 1. 基础样式：柔和护眼配色 + 大字号 + 大按钮 ========== */
:root{
  --bg:#fdf8ee;        /* 米黄护眼底色 */
  --card:#ffffff;
  --ink:#4a4036;       /* 柔和深棕文字 */
  --sub:#8a7d70;
  --math:#7fb6e3;      /* 数学秘境：柔蓝 */
  --chn:#8fcb98;       /* 语文森林：柔绿 */
  --eng:#f2b27f;       /* 英语海岛：柔橙 */
  --main:#7fb6e3;      /* 当前科目主色（进入科目后切换） */
  --ok:#6cc08b;
  --no:#f09a8a;
  --gold:#f5c542;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6;
  min-height:100vh;min-height:100dvh;
  -webkit-user-select:none;user-select:none;
}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}

/* 顶部栏：首页按钮 + 标题 + 音效开关 */
#top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(253,248,238,.95);
  border-bottom:2px solid #f1e8d6;
}
#top .tb{width:48px;height:48px;border-radius:14px;background:#fff;font-size:24px;box-shadow:0 2px 0 #eadfca}
#top .tb.hid{visibility:hidden}
#ttl{font-size:20px;font-weight:700;text-align:center;flex:1;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{padding:14px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto}

/* 通用按钮：高度≥56px，方便孩子点击 */
.btn{
  display:block;width:100%;min-height:58px;border-radius:18px;font-size:21px;font-weight:700;
  background:var(--main);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);margin:12px 0;padding:10px 14px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.lite{background:#fff;color:var(--ink);box-shadow:0 4px 0 #eadfca}
.btn.gold{background:var(--gold);color:#6b4d00}
.row{display:flex;gap:10px}.row .btn{flex:1}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 3px 0 #eee3cf;margin:12px 0}
.center{text-align:center}
.muted{color:var(--sub);font-size:16px}
h2{font-size:24px;margin:6px 0 4px}

/* ========== 2. 首页 ========== */
.hero{text-align:center;padding:16px 0 6px}
.hero .big{font-size:30px;font-weight:800;letter-spacing:2px}
.hero .roles{font-size:48px;margin:12px 0;letter-spacing:6px}

/* ========== 3. 角色选择 ========== */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.rcard{background:#fff;border-radius:20px;padding:14px 6px;text-align:center;border:4px solid transparent;box-shadow:0 3px 0 #eee3cf}
.rcard .e{font-size:58px;line-height:1.2}
.rcard .n{font-size:18px;font-weight:700}
.rcard.on{border-color:var(--gold);background:#fffaf0}
.name-in{width:100%;height:56px;border-radius:16px;border:3px solid #eadfca;font-size:20px;padding:0 14px;background:#fff;color:var(--ink)}

/* ========== 4. 科目卡片 ========== */
.scard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:22px;padding:16px;margin:14px 0;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.scard .i{font-size:46px}
.scard .t{font-size:23px;font-weight:800}
.scard .p{font-size:16px;opacity:.95}

/* ========== 5. 冒险地图（站点列表） ========== */
.stat{display:flex;justify-content:space-around;text-align:center;font-size:16px}
.stat b{display:block;font-size:22px}
.tier{margin:18px 0 6px;font-weight:800;font-size:18px;color:var(--sub)}
.station{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 #eee3cf;border:3px solid transparent}
.station .num{width:50px;height:50px;border-radius:50%;background:var(--main);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.station .nm{font-size:19px;font-weight:700}
.station .ds{font-size:15px;color:var(--sub)}
.station .rt{margin-left:auto;font-size:26px;flex:none}
.station.lock{opacity:.55}
.station.lock .num{background:#c9c0b4}
.station.next{border-color:var(--gold)}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini .btn{flex:1;min-width:30%;font-size:17px;min-height:50px;margin:6px 0}

/* ========== 6. 答题界面 ========== */
.qhead{display:flex;justify-content:space-between;font-size:16px;color:var(--sub);font-weight:700}
.bar{height:12px;border-radius:8px;background:#efe6d5;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main);border-radius:8px;transition:width .4s}
.guide{display:flex;align-items:center;gap:10px;margin:4px 0}
.ava{font-size:46px;line-height:1}
.bubble{background:#fff;border-radius:16px;padding:8px 12px;font-size:16px;box-shadow:0 2px 0 #eee3cf;position:relative}
.qcard{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 3px 0 #eee3cf;margin:10px 0}
.qtext{font-size:22px;font-weight:700;line-height:1.7}
.qtag{display:inline-block;font-size:14px;background:#f4eddf;color:var(--sub);border-radius:10px;padding:1px 10px;margin-bottom:6px}
.passage{background:#fbf6ea;border-radius:14px;padding:10px 12px;font-size:18px;line-height:1.8;margin-bottom:10px;font-weight:400}
.opt{display:block;width:100%;min-height:60px;background:#fff;border:3px solid #eadfca;border-radius:18px;font-size:21px;font-weight:600;margin:10px 0;padding:10px 14px;text-align:center;box-shadow:0 3px 0 #eadfca}
.opt:active{background:#fff8e6}
.opt.bad{opacity:.4;text-decoration:line-through}
.opt .emo{font-size:34px}
/* 分数显示：上下结构 */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 3px;font-size:.9em}
.fr b:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr b{font-weight:700}
/* 竖式显示 */
.vt{font-family:"Menlo","Courier New",monospace;font-size:30px;font-weight:700;width:150px;margin:8px auto 0;text-align:right;letter-spacing:4px;line-height:1.35}
.vt .op{float:left;letter-spacing:0}
.vt .ln{border-top:3px solid var(--ink);margin:2px 0}
.vt .qm{color:var(--main)}
/* 数字键盘（不调用系统键盘，孩子操作更简单） */
.ansbox{height:64px;border-radius:18px;background:#fff;border:3px dashed var(--main);font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:3px}
.ansbox .ph{font-size:17px;color:#b6aa9b;letter-spacing:0;font-weight:400}
.unit{font-size:20px;margin-left:6px;color:var(--sub)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.pad button{height:60px;border-radius:16px;background:#fff;font-size:28px;font-weight:700;box-shadow:0 3px 0 #eadfca}
.pad button:active{transform:translateY(2px);box-shadow:none}

/* ========== 7. 弹窗（剧情/反馈/徽章/海报） ========== */
.modal{position:fixed;inset:0;background:rgba(74,64,54,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal.hidden{display:none}
.mbox{background:#fffdf7;border-radius:26px;padding:20px 18px;width:100%;max-width:420px;max-height:88vh;overflow:auto;text-align:center;animation:pop .25s ease-out}
.mbox .me{font-size:72px;line-height:1.2}
.mbox .mt{font-size:24px;font-weight:800;margin:4px 0}
.mbox .mx{font-size:18px;text-align:left;line-height:1.75;margin:8px 0}
.hint{background:#fff6dc;border-radius:16px;padding:10px 12px;text-align:left;font-size:18px;margin:10px 0}
.reveal{background:#eaf6ee;border-radius:16px;padding:10px 12px;text-align:left;font-size:18px;margin:10px 0}
.story{background:#fff;border-radius:18px;padding:12px 14px;text-align:left;font-size:19px;line-height:1.8;box-shadow:inset 0 0 0 3px #f3ead8}
.gain{font-size:24px;font-weight:800;color:#d49a00}

/* 徽章 */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.badge{background:#fff;border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 3px 0 #eee3cf}
.badge .bi{font-size:40px;line-height:1.2;width:62px;height:62px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff6d6,#f7dc8a)}
.badge .bn{font-size:14px;font-weight:700;margin-top:4px}
.badge.off .bi{background:#ece6dc;filter:grayscale(1);opacity:.5}
.badge.off .bn{color:#b6aa9b}

/* 错题本 */
.wrong{background:#fff;border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 #eee3cf;font-size:17px}
.wrong .wq{font-weight:700;font-size:19px;margin:4px 0}
.wrong .wy{color:#d0705e}.wrong .wa{color:#3f9a62}
.wrong .we{background:#fbf6ea;border-radius:12px;padding:8px 10px;margin-top:6px}

/* 奖状图片 */
#certImg{width:100%;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:block;-webkit-touch-callout:default}

/* ========== 8. 适度动画（开心跳跃 / 轻微摇头） ========== */
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-18px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hop{display:inline-block;animation:hop .9s ease-in-out 1}
.shake{display:inline-block;animation:shake .5s ease-in-out 1}
@media (prefers-reduced-motion:reduce){.hop,.shake,.mbox{animation:none}}

/* ========== 9. 打印：只打印奖状 ========== */
@media print{
  @page{margin:8mm}
  body{background:#fff}
  body *{visibility:hidden}
  #certImg,#certImg *{visibility:visible}
  #certImg{position:absolute;left:0;top:0;width:100%;box-shadow:none;border-radius:0}
}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div id="top">
  <button class="tb" id="homeBtn" onclick="tapHome()" aria-label="首页">🏠</button>
  <div id="ttl">小小探险家</div>
  <button class="tb" id="sndBtn" onclick="toggleSound()" aria-label="音效开关">🔊</button>
</div>
<!-- 主内容区：所有页面由 JS 渲染到这里 -->
<div id="main"></div>
<!-- 通用弹窗 -->
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>

<script>

   ===================================================================== */

  owl:     {e:'🦉', n:'猫头鹰博博'}

   e  完整解析（错题本、或连续答错 3 次后显示）
   分数写法：[1/4] 会显示为上下结构的“四分之一”
   ===================================================================== */
const SUBJECTS = {

math:{
  name:'数学秘境', icon:'🔢', color:'#7fb6e3', place:'数学秘境',
  intro:'数学秘境的大门打开啦！传说秘境深处藏着闪闪发光的“智慧宝石”。只要解开 9 个站点的数学谜题，就能找到它。{R}，我们出发吧！',
  ending:'哇！你登上了智慧山顶，智慧宝石发出了耀眼的光芒！数学秘境的守护者为你颁发了全部徽章！',

    {t:'i', q:'一个长方形花坛周长 30 米，长 10 米，宽是多少米？', u:'米', a:'5', h:'周长的一半是“一条长 + 一条宽”。', e:'30 ÷ 2 = 15（米），15 − 10 = 5（米），宽是 5 米。'},

/* =====================================================================
   C. 存档（localStorage，三科数据各自独立）
   ===================================================================== */
const KEY = 'xxtxj_save_v1';
function blankSubj(){
  return {role:null, st:Array.from({length:9},()=>({stars:0,frags:0,score:0,pass:false})), wrong:[], poster:false};
}
function loadSave(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.subj) return s; }catch(e){}
  return {sound:true, name:'', pick:null, subj:{math:blankSubj(), chinese:blankSubj(), english:blankSubj()}};
}
let S = loadSave();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* =====================================================================
   D. 轻柔音效（WebAudio 合成，无需音频文件）
   ===================================================================== */
let AC = null;
function tone(freq, dur, delay, type, vol){
  if(!S.sound) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.07, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}

  tap:()=>tone(660,.07,0,'sine',.04),
  ok: ()=>{tone(523,.15);tone(784,.25,.12)},
  no: ()=>tone(330,.25,0,'triangle',.05),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,i*.14))
};
function toggleSound(){
  S.sound = !S.sound; save(); updSnd(); if(S.sound) SFX.tap();
}

/* =====================================================================
   E. 工具函数
   ===================================================================== */
const $main = document.getElementById('main');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 题目文本格式化：保留 emo 标签，转换 [a/b] 为分数 */
function fmt(s){
  let h = String(s);
  // 先临时保护 emoji 标签，其余内容转义，防止 "<" ">" 被当成标签
  const keep = [];
  h = h.replace(/<span class="emo">(.*?)<\/span>/g, (m,x)=>{keep.push(x); return '\u0001'+(keep.length-1)+'\u0002';});
  h = esc(h);
  h = h.replace(/\u0001(\d+)\u0002/g, (m,i)=>'<span class="emo">'+keep[i]+'</span>');
  h = h.replace(/\[(\d+)\/(\d+)\]/g, '<span class="fr"><b>$1</b><b>$2</b></span>');
  return h;
}
function plain(s){ return String(s).replace(/<[^>]+>/g,'').replace(/\[(\d+)\/(\d+)\]/g,'$2分之$1'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function roleOf(k){ return ROLES[S.subj[k].role || S.pick || 'rabbit']; }
function tellR(s, k){ return s.replace(/\{R\}/g, roleOf(k).n); }
function setTop(title, showHome){
  document.getElementById('ttl').textContent = title;
  document.getElementById('homeBtn').classList.toggle('hid', !showHome);
}
function setColor(k){ document.documentElement.style.setProperty('--main', k ? SUBJECTS[k].color : '#7fb6e3'); }
function totals(k){
  const st = S.subj[k].st;
  return {
    stars: st.reduce((a,b)=>a+b.stars,0),
    frags: st.reduce((a,b)=>a+b.frags,0),
    score: st.reduce((a,b)=>a+b.score,0),
    badges:st.filter(x=>x.pass).length
  };
}
function allPass(k){ return S.subj[k].st.every(x=>x.pass); }

/* =====================================================================
   J. 答题流程
   R：本次闯关的临时状态
   ===================================================================== */
let R = null;
function startStation(k,i){
  R = {k, i, qi:0, stars:0, frags:0, score:0, tries:0, input:'', bad:[], order:null};
  CUR={screen:'quiz',k}; setTop(SUBJECTS[k].stations[i].name,true);
  prepQ(); renderQ();
}
function curQ(){ return SUBJECTS[R.k].stations[R.i].qs[R.qi]; }
function prepQ(){
  const q=curQ(); R.tries=0; R.input=''; R.bad=[];
  if(q.o){ const idx=q.o.map((_,j)=>j); R.order = q.ns ? idx : shuffle(idx); }
}
function vert(v){
  return `<div class="vt"><div>${esc(v[0])}</div><div><span class="op">${esc(v[1])}</span>${esc(v[2])}</div><div class="ln"></div><div class="qm">?</div></div>`;
}
function renderQ(){
  window.scrollTo(0,0);
  const st=SUBJECTS[R.k].stations[R.i], q=curQ(), n=st.qs.length, r=roleOf(R.k);
  let h = `
    <div class="qhead"><span>${TIERS[st.tier]}</span><span>第 ${R.qi+1}/${n} 题</span><span>⭐${R.stars} 🧩${R.frags}</span></div>
    <div class="bar"><i style="width:${R.qi/n*100}%"></i></div>
    <div class="guide"><span class="ava">${r.e}</span><div class="bubble">${R.tries?'再仔细想一想，你可以的！':rnd(['认真读题，你一定行！','慢慢想，不着急～','我相信你！'])}</div></div>
    <div class="qcard">
      ${st.p?`<div class="passage">${esc(st.p)}</div>`:''}
      <div class="qtext">${fmt(q.q)}</div>${q.v?vert(q.v):''}
    </div>`;
  if(q.t==='i'){
    // 数字键盘填空题
    h += `<div class="ansbox" id="ansBox"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="key('${d}')">${d}</button>`).join('')}
        <button onclick="key('C')" style="font-size:20px">清空</button>
        <button onclick="key('0')">0</button>
        <button onclick="key('B')">⌫</button></div>
      <button class="btn" onclick="submitInput()">✅ 确定</button>`;
  }else{
    h += R.order.map(j=>`<button class="opt ${R.bad.includes(j)?'bad':''}" ${R.bad.includes(j)?'disabled':''} onclick="pickOpt(${j})">${fmt(q.o[j])}</button>`).join('');
  }
  $main.innerHTML = h;
  if(q.t==='i') drawAns();
}
function drawAns(){
  const q=curQ(), b=document.getElementById('ansBox');
  b.innerHTML = R.input ? esc(R.input)+(q.u?`<span class="unit">${esc(q.u)}</span>`:'') : '<span class="ph">点下面的数字输入答案</span>';
}
function key(d){
  SFX.tap();
  if(d==='B') R.input=R.input.slice(0,-1);
  else if(d==='C') R.input='';
  else if(R.input.length<6) R.input = (R.input==='0'?'':R.input)+d;
  drawAns();
}
function submitInput(){
  if(!R.input){ SFX.no(); return; }
  const q=curQ();
  judge(String(Number(R.input))===String(Number(q.a)), R.input+(q.u||''));
}
function pickOpt(j){ const q=curQ(); judge(j===q.a, q.o[j], j); }

/* 判题：答对 → 开心动画 + 星星/碎片；答错 → 鼓励 + 提示，可重试；连错 3 次显示解析 */
function judge(ok, yours, optIdx){
  const q=curQ(), r=roleOf(R.k);
  if(ok){
    SFX.ok();
    const first = R.tries===0;
    if(first){ R.stars++; R.score+=10; } else { R.score+=5; }
    R.frags++;
    modal(`<div class="me hop">${r.e}</div><div class="mt">${rnd(CHEER_OK)}</div>
      <div class="gain">${first?'⭐ +1　🧩 +1':'🧩 +1'}</div>
      ${first?'':'<div class="muted">改正了错误，也很了不起！</div>'}
      <button class="btn" onclick="SFX.tap();closeModal();nextQ()">${R.qi+1<SUBJECTS[R.k].stations[R.i].qs.length?'下一题 ➜':'看看成绩 ➜'}</button>`);
  }else{
    SFX.no();
    R.tries++;
    addWrong(q, yours);
    if(optIdx!==undefined) R.bad.push(optIdx);
    if(R.tries>=3){
      const ans = q.t==='i' ? q.a+(q.u||'') : q.o[q.a];
      modal(`<div class="me">${r.e}</div><div class="mt">我们一起来看看解析吧</div>
        <div class="reveal">✅ 正确答案：<b>${fmt(ans)}</b><br>📖 ${fmt(q.e)}</div>
        <div class="muted">这道题已经放进错题本，以后可以再复习哦！</div>
        <button class="btn" onclick="SFX.tap();closeModal();nextQ()">我明白了，继续 ➜</button>`);
    }else{
      modal(`<div class="me shake">${r.e}</div><div class="mt">${rnd(CHEER_NO)}</div>
        <div class="hint">💡 小提示：${fmt(q.h)}</div>
        <button class="btn" onclick="SFX.tap();closeModal();R.input='';renderQ()">再试一次</button>`);
    }
  }
}
function nextQ(){
  R.qi++;
  if(R.qi >= SUBJECTS[R.k].stations[R.i].qs.length){ endStation(); return; }
  prepQ(); renderQ();
}

/* 站点结算：达标解锁下一关 + 颁发徽章 */
function endStation(){
  const k=R.k, i=R.i, st=SUBJECTS[k].stations[i], rec=S.subj[k].st[i], r=roleOf(k);
  const pass = R.stars>=PASS_STAR && R.frags>=PASS_FRAG;
  const firstPass = pass && !rec.pass;
  rec.stars=Math.max(rec.stars,R.stars); rec.frags=Math.max(rec.frags,R.frags); rec.score=Math.max(rec.score,R.score);
  if(pass) rec.pass=true;
  save();
  CUR={screen:'map',k};
  const done = allPass(k);
  if(pass){
    SFX.win();
    const isLast = i===8;
    modal(`<div class="me hop">${r.e}</div><div class="mt">🎉 闯关成功！</div>
      <div class="gain">⭐ ${R.stars}　🧩 ${R.frags}　得分 ${R.score}</div>
      ${firstPass?`<div class="badge" style="margin:12px auto;width:140px"><div class="bi">${st.badge[0]}</div><div class="bn">获得徽章<br>「${st.badge[1]}」</div></div>`:''}
      ${firstPass && !isLast?`<div class="story">${esc(SUBJECTS[k].stations[i+1].story)}</div>`:''}
      ${done && firstPass?`<button class="btn gold" onclick="closeModal();goMap('${k}');showPoster('${k}')">🏆 查看通关海报</button>`:''}
      ${!isLast?`<button class="btn" onclick="closeModal();goMap('${k}');tapStation('${k}',${i+1})">前往下一站 ➜</button>`:''}
      <button class="btn lite" onclick="closeModal();goMap('${k}')">返回冒险地图</button>`);
  }else{
    modal(`<div class="me">${r.e}</div><div class="mt">还差一点点就过关啦！</div>
      <div class="muted">过关需要 ⭐${PASS_STAR} + 🧩${PASS_FRAG}<br>这次获得 ⭐${R.stars} 🧩${R.frags}</div>
      <div class="hint">💡 第一次就答对才能得到星星，先去错题本看看解析，再来挑战吧！</div>
      <button class="btn" onclick="closeModal();startStation('${k}',${i})">再挑战一次</button>
      <button class="btn lite" onclick="closeModal();goWrong('${k}')">去看错题本</button>
      <button class="btn lite" onclick="closeModal();goMap('${k}')">返回冒险地图</button>`);
  }
  goMap(k);
}

/* =====================================================================
   K. 错题本（按科目独立）
   ===================================================================== */
function addWrong(q, yours){
  const my=S.subj[R.k], key=R.i+'-'+R.qi, st=SUBJECTS[R.k].stations[R.i];
  const ans = q.t==='i' ? q.a+(q.u||'') : q.o[q.a];
  const item = {key, st:st.name, q:q.q, p:st.p||'', yours:String(yours), ans, e:q.e, n:1};
  const old = my.wrong.findIndex(w=>w.key===key);
  if(old>=0){ item.n = (my.wrong[old].n||1)+1; my.wrong.splice(old,1); }
  my.wrong.unshift(item);
  save();
}
function goWrong(k){
  CUR={screen:'wrong',k}; setColor(k); setTop('📒 错题本',true); window.scrollTo(0,0);
  const list=S.subj[k].wrong;
  let h = `<div class="card center"><b>${SUBJECTS[k].icon} ${SUBJECTS[k].name}</b><div class="muted">共 ${list.length} 道错题，看懂解析再去挑战吧！</div></div>`;
  if(!list.length) h += `<div class="card center"><div style="font-size:50px">🌟</div>还没有错题，真棒！</div>`;
  list.forEach((w,idx)=>{
    h += `<div class="wrong"><div class="muted">📍 ${esc(w.st)}　错过 ${w.n||1} 次</div>
      ${w.p?`<div class="passage" style="font-size:16px">${esc(w.p)}</div>`:''}
      <div class="wq">${fmt(w.q)}</div>
      <div class="wy">✘ 我的答案：${fmt(w.yours)}</div>
      <div class="wa">✔ 正确答案：${fmt(w.ans)}</div>
      <div class="we">📖 ${fmt(w.e)}</div>
      <button class="btn lite" style="min-height:46px;font-size:17px" onclick="delWrong('${k}',${idx})">我已掌握，移出错题本</button></div>`;
  });
  if(list.length) h += `<button class="btn lite" onclick="clearWrong('${k}')">🧹 清空错题本</button>`;
  h += `<button class="btn" onclick="SFX.tap();goMap('${k}')">返回冒险地图</button>`;
  $main.innerHTML = h;
}
function delWrong(k,idx){ SFX.tap(); S.subj[k].wrong.splice(idx,1); save(); goWrong(k); }

/* =====================================================================
   N. 电子奖状：Canvas 绘制成图片 → 长按保存 / 打印
   ===================================================================== */
function rr(x,X,Y,W,H,R){ x.beginPath();x.moveTo(X+R,Y);x.lineTo(X+W-R,Y);x.quadraticCurveTo(X+W,Y,X+W,Y+R);x.lineTo(X+W,Y+H-R);x.quadraticCurveTo(X+W,Y+H,X+W-R,Y+H);x.lineTo(X+R,Y+H);x.quadraticCurveTo(X,Y+H,X,Y+H-R);x.lineTo(X,Y+R);x.quadraticCurveTo(X,Y,X+R,Y);x.closePath(); }
function wrapText(x, text, X, Y, maxW, lh){
  let line='', y=Y;
  for(const ch of text){
    if(x.measureText(line+ch).width > maxW){ x.fillText(line, X, y); line=ch; y+=lh; }
    else line+=ch;
  }
  if(line) x.fillText(line, X, y);
  return y;
}
function drawCert(k){
  const s=SUBJECTS[k], r=roleOf(k), t=totals(k);
  const W=900, H=1240, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const F='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  // 背景与双边框
  x.fillStyle='#fffaf0'; x.fillRect(0,0,W,H);
  x.lineWidth=14; x.strokeStyle=s.color; rr(x,24,24,W-48,H-48,36); x.stroke();
  x.lineWidth=4; x.strokeStyle='#e8c56a'; rr(x,50,50,W-100,H-100,26); x.stroke();
  // 四角小星星
  x.font='48px '+F; x.textAlign='center'; x.textBaseline='middle';
  [[95,95],[W-95,95],[95,H-95],[W-95,H-95]].forEach(p=>x.fillText('⭐',p[0],p[1]));
  // 标题
  x.fillStyle='#c0503a'; x.font='bold 112px '+F; x.fillText('奖　状',W/2,190);
  x.fillStyle='#8a7d70'; x.font='30px '+F; x.fillText('— 小小探险家 · 三年级上册 —',W/2,280);
  // 角色
  x.font='170px '+F; x.fillText(r.e,W/2,440);
  x.fillStyle='#4a4036'; x.font='bold 34px '+F; x.fillText('探险伙伴：'+r.n,W/2,570);
  // 正文
  x.textAlign='left'; x.textBaseline='alphabetic';
  x.font='bold 46px '+F; x.fillText((S.name||'小小探险家')+' 小朋友：',110,670);
  x.font='38px '+F;
  const body='　　你在「'+s.name+'」冒险中勇闯 9 个站点，共获得 '+t.stars+' 颗星星、'+t.frags+' 枚探险碎片，集齐全部 9 枚徽章，表现非常出色！特发此状，以资鼓励！';
  wrapText(x, body, 110, 750, W-220, 64);
  // 徽章一排
  x.textAlign='center'; x.font='52px '+F;
  s.stations.forEach((st,i)=>x.fillText(st.badge[0], 150+i*75, 1000));
  // 落款与日期
  const d=new Date();
  x.fillStyle='#4a4036'; x.font='34px '+F; x.textAlign='right';
  x.fillText(s.name+' 探险委员会',W-110,1090);
  x.fillText(d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日',W-110,1140);
  // 印章
  x.strokeStyle='rgba(205,70,55,.85)'; x.lineWidth=6;
  x.beginPath(); x.arc(200,1100,72,0,Math.PI*2); x.stroke();
  x.fillStyle='rgba(205,70,55,.85)'; x.textAlign='center'; x.font='bold 30px '+F;
  x.fillText('通关',200,1092); x.fillText('认证',200,1130);
  return c.toDataURL('image/png');
}
function goCert(k){
  if(!allPass(k)){ goMap(k); return; }
  CUR={screen:'cert',k}; setColor(k); setTop('📜 电子奖状',true); window.scrollTo(0,0);
  $main.innerHTML = `<div class="muted center" style="margin-bottom:8px">正在制作奖状…</div>`;
  setTimeout(()=>{
    $main.innerHTML = `
      <img id="certImg" src="${drawCert(k)}" alt="奖状">
      <div class="muted center" style="margin:10px 0">📱 长按奖状图片 →“存储到照片”即可保存<br>如果打印按钮没有反应：先保存图片，再到“照片”里分享 →“打印”</div>
      <button class="btn gold" onclick="SFX.tap();window.print()">🖨️ 打印奖状</button>
      <button class="btn lite" onclick="SFX.tap();goGallery('${k}')">🏅 查看图鉴</button>
      <button class="btn" onclick="SFX.tap();goMap('${k}')">返回冒险地图</button>`;
  },60);
}
