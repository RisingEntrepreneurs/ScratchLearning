<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!-- 离线网页 App：应用清单、桌面图标、主屏幕显示名称 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="坐标角度探险">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF7E8">
<title>Scratch坐标角度探险</title>
<!--
=====================================================================
  Scratch 坐标与角度 · 闯关学习小游戏（单文件版）
  - 纯前端：所有 CSS / JS / 图形(SVG) 内置，无任何外部资源
  - 适配 iPhone Safari 竖屏；数据用 localStorage 保存（每个角色独立存档）
  - 规则严格对标 Scratch 3.0：
      舞台 480×360，中心(0,0)，x:-240~240（右正左负），y:-180~180（上正下负）
      方向：0°上 / 90°右 / 180°下 / -90°左；方向显示范围 -179~180
      右转↻ = 顺时针（方向值增加），左转↺ = 逆时针（方向值减少）
=====================================================================
-->
<style>
/* ---------- 1. 全局配色（柔和护眼） ---------- */
:root{
  --bg:#FFF7E8; --card:#FFFFFF; --ink:#3D3A4B; --sub:#7A7690;
  --pri:#7C6BD6; --pri-soft:#EEEAFE; --sun:#FFC24B; --sun-soft:#FFF1CC;
  --ok:#43B07A; --ok-soft:#E3F6EC; --bad:#EE7B6B; --bad-soft:#FDECE8;
  --sky:#E3F1FF; --line:#E9E2D3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;}
body{min-height:100vh;
  background-image:radial-gradient(circle at 10% 8%,#FFE9C2 0,transparent 30%),radial-gradient(circle at 92% 30%,#E7E2FF 0,transparent 28%);
  background-attachment:fixed;}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 66px) 16px calc(env(safe-area-inset-bottom) + 28px);}

/* ---------- 2. 顶部栏 ---------- */
.topbar{position:fixed;left:0;right:0;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,247,232,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);}
.tb{width:46px;height:46px;border-radius:14px;border:none;background:#fff;font-size:22px;
  box-shadow:0 2px 0 var(--line);}
.tb.ghost{visibility:hidden}
.tbt{flex:1;text-align:center;font-weight:700;font-size:18px}

/* ---------- 3. 通用按钮 / 卡片 ---------- */
.btn{display:block;width:100%;min-height:56px;margin:12px 0;border:none;border-radius:18px;
  font-size:19px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 4px 0 var(--line);}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 4px 0 #5B4BB0}
.btn.sun{background:var(--sun);color:#5A3B00;box-shadow:0 4px 0 #D69A1E}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #2E8A5C}
.btn.big{min-height:66px;font-size:22px}
.btn.small{min-height:44px;font-size:16px;margin:8px 0}
.row2{display:flex;gap:12px}.row2 .btn{flex:1}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 3px 0 var(--line)}
.lead{font-size:17px;line-height:1.6;color:var(--sub);text-align:center}
.tip{font-size:14px;color:var(--sub);text-align:center}
.hidden{display:none!important}

/* ---------- 4. 首页 ---------- */
.hero{text-align:center;padding:8px 0 4px}
.logo{font-size:56px;animation:bob 2.6s ease-in-out infinite}
.hero h1{margin:6px 0;font-size:32px;line-height:1.25;color:var(--pri)}
.hero .sub{font-size:17px;color:var(--sub);margin:6px 0 14px}
.curChar{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px 18px 8px 8px;
  box-shadow:0 3px 0 var(--line);font-size:17px;margin-bottom:6px}
.curChar svg{width:64px;height:64px}

/* ---------- 5. 角色选择 ---------- */
.charGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.charCard{background:#fff;border:3px solid transparent;border-radius:22px;padding:12px 8px;
  box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.charCard svg{width:96px;height:96px}
.charCard b{font-size:20px}.charCard small{font-size:14px;color:var(--sub)}
.charCard.on{border-color:var(--pri);background:var(--pri-soft)}

/* ---------- 6. 地图 ---------- */
.stats{display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.stats svg{width:52px;height:52px}
.stats .st{flex:1;display:flex;justify-content:space-around;font-size:17px;font-weight:700}
.tier{margin:20px 4px 6px;font-weight:800;font-size:16px;color:var(--pri);display:flex;align-items:center;gap:6px}
.tier:after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:#fff;
  border-radius:20px;padding:12px 14px;margin:10px 0;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.node .ic{width:54px;height:54px;border-radius:16px;background:var(--sun-soft);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.node .tx{flex:1}.node .tx b{display:block;font-size:18px}.node .tx small{font-size:14px;color:var(--sub)}
.node .rt{font-size:15px;font-weight:700;text-align:right;flex:none}
.node.lock{opacity:.55}.node.lock .ic{background:#EEE}
.node.done .ic{background:var(--ok-soft)}

/* ---------- 7. 答题界面 ---------- */
.qhead{display:flex;align-items:center;gap:10px}
.qhead .ava{width:62px;height:62px;flex:none}
.bubble{position:relative;flex:1;background:#fff;border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.5;box-shadow:0 2px 0 var(--line)}
.bubble:before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.prog{height:10px;background:#EFE8DA;border-radius:6px;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FFA94D);border-radius:6px;transition:width .4s}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
.qtag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:10px;background:var(--pri-soft);color:var(--pri);margin-bottom:8px}
.qtext{font-size:20px;line-height:1.6;font-weight:600}
.blk{display:inline-block;background:#4C97FF;color:#fff;border-radius:10px;padding:0 8px;margin:2px 1px;font-size:17px;line-height:1.7}
.blk.mo{background:#4C97FF}
.stage{width:100%;display:block;margin:10px 0 2px;border-radius:12px;background:#fff}
.stage .bgR{fill:#FBFDFF;stroke:#9DB7D9;stroke-width:3}
.stage .gl{stroke:#E1EAF5;stroke-width:1.5}
.stage .ax{stroke:#8DA6C8;stroke-width:2.5}
.stage text{font-size:17px;fill:#6E86A8;font-weight:600}
.opts{display:grid;gap:12px;margin-top:6px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:60px;border:3px solid transparent;border-radius:18px;background:#fff;font-size:20px;font-weight:700;color:var(--ink);
  box-shadow:0 4px 0 var(--line);padding:8px 10px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:#22744C}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:#B4473A}
.opt:disabled{opacity:.9}
.fillBox{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 10px}
.fillShow{min-width:150px;height:62px;border-radius:16px;background:#fff;border:3px dashed var(--pri);font-size:32px;font-weight:800;
  display:flex;align-items:center;justify-content:center;color:var(--pri)}
.fillShow.good{border:3px solid var(--ok);color:var(--ok)}.fillShow.bad{border:3px solid var(--bad);color:var(--bad)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{height:58px;border:none;border-radius:16px;background:#fff;font-size:24px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.fn{background:var(--sun-soft)}.key.go{background:var(--pri);color:#fff;box-shadow:0 4px 0 #5B4BB0;font-size:19px}
.spacer{height:var(--sheetH,0px)}

/* ---------- 8. 反馈面板（底部弹出） ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;
  background:#fff;border-radius:26px 26px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 14px);
  box-shadow:0 -6px 24px rgba(60,50,90,.15);transform:translateY(110%);transition:transform .3s ease}
.sheet.show{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px}
.sheet .sh svg{width:60px;height:60px;flex:none}
.sheet h3{margin:0;font-size:21px}
.sheet .ok h3{color:var(--ok)}
.sheet .gain{font-size:16px;font-weight:700;color:#B07A00;margin-top:2px}
.sheet .exp{font-size:16px;line-height:1.65;background:var(--sky);border-radius:14px;padding:10px 12px;margin:10px 0 4px;max-height:34vh;overflow:auto}
.sheet .exp.hint{background:var(--sun-soft)}

/* ---------- 9. 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(50,40,80,.38);display:flex;align-items:center;justify-content:center;padding:18px}
.mbox{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:460px;max-height:86vh;overflow:auto;animation:pop .3s ease}
.mbox h2{margin:0 0 8px;text-align:center;color:var(--pri)}
.story{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.story svg{width:78px;height:78px;flex:none}
.story .bubble{font-size:17px;line-height:1.7;background:var(--pri-soft)}
.story .bubble:before{border-right-color:var(--pri-soft)}
.badgeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;background:var(--sun-soft);border-radius:18px;padding:10px 4px}
.badge .bi{width:58px;height:58px;margin:0 auto 4px;border-radius:50%;background:linear-gradient(145deg,#FFD978,#FFB443);
  display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 3px 0 #D9962A}
.badge b{font-size:13px;display:block}.badge small{font-size:11px;color:var(--sub)}
.badge.lock{background:#F1F0F4}.badge.lock .bi{background:#DDDAE6;box-shadow:0 3px 0 #C4C0D1;filter:grayscale(1);opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);z-index:60;
  background:rgba(61,58,75,.92);color:#fff;padding:12px 18px;border-radius:16px;font-size:16px;max-width:86%;text-align:center;animation:pop .25s}

/* ---------- 10. 结果 / 海报 / 奖状 ---------- */
.resStars{font-size:30px;text-align:center;letter-spacing:2px;margin:6px 0}
.resStars .off{filter:grayscale(1);opacity:.3}
.bigAva{width:130px;height:130px;display:block;margin:0 auto}
.newBadge{text-align:center;background:var(--sun-soft);border-radius:20px;padding:14px;margin:12px 0;animation:pop .5s}
.newBadge .bi{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(145deg,#FFD978,#FFB443);
  display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 4px 0 #D9962A;animation:spin 1.2s ease}
.poster{background:linear-gradient(180deg,#EEEAFE,#FFF1CC);border-radius:26px;padding:18px;text-align:center;border:4px solid #fff;box-shadow:0 4px 0 var(--line)}
.poster h2{margin:4px 0;color:var(--pri);font-size:26px}
.pstat{display:flex;justify-content:space-around;font-size:18px;font-weight:800;margin:10px 0}
.input{width:100%;height:56px;border-radius:16px;border:3px solid var(--line);font-size:20px;padding:0 14px;font-family:inherit;color:var(--ink);background:#fff}
#certImg{width:100%;border-radius:12px;box-shadow:0 4px 14px rgba(60,50,90,.15);display:block;margin:10px 0}
.wcard .wh{font-size:14px;color:var(--pri);font-weight:700;margin-bottom:4px}
.wcard .wq{font-size:17px;font-weight:600;line-height:1.55}
.wcard .wa{font-size:15px;margin:6px 0;line-height:1.6}
.wcard .wa b.r{color:var(--ok)}.wcard .wa b.w{color:var(--bad)}
.wcard .exp{font-size:15px;line-height:1.6;background:var(--sky);border-radius:12px;padding:8px 10px}

/* ---------- 11. 动画（适度） ---------- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes spin{0%{transform:rotateY(0) scale(.6)}100%{transform:rotateY(360deg) scale(1)}}
.happy{animation:jump .7s ease}
.sad{animation:shake .45s ease}
.bob{animation:bob 2.6s ease-in-out infinite}

/* ---------- 12. 打印：只打印奖状 ---------- */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:8mm}
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;height:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet"></div>
<div id="modal" class="modal hidden"></div>
<div id="printArea"><img id="printImg" alt="奖状"></div>

<script>
/* =====================================================================
   一、角色数据 & 角色 SVG（默认朝右 = Scratch 方向 90°）
   ===================================================================== */
const CHARS = {
  cat:   {name:'小猫',   intro:'喵～我是Scratch小猫！舞台就是我的游乐场，跟我一起去找编程水晶的碎片吧！'},
  dino:  {name:'小恐龙', intro:'嗷呜～我是小恐龙！我会一步一步量坐标，跟我出发吧！'},
  rocket:{name:'火箭',   intro:'嗖～我是小火箭！转向、前进我最在行，准备好起飞了吗？'},
  bfly:  {name:'小蝴蝶', intro:'扑扑～我是小蝴蝶！飞到哪里都认得方向，一起去探险吧！'}
};
// 返回角色图形（以 (0,0) 为中心，约 60×60，头朝右）
function charG(id){
  if(id==='dino') return `
    <path d="M-14 2 L-31 12 L-12 13 Z" fill="#5CC06A" stroke="#2F8A3E" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="-13,-6 -9,-15 -5,-7" fill="#FFD25A" stroke="#D9A21E" stroke-width="1.5"/>
    <polygon points="-5,-8 -1,-17 3,-8" fill="#FFD25A" stroke="#D9A21E" stroke-width="1.5"/>
    <polygon points="3,-8 7,-16 10,-8" fill="#FFD25A" stroke="#D9A21E" stroke-width="1.5"/>
    <path d="M-10 13 v8 M4 13 v8" stroke="#2F8A3E" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-3" cy="4" rx="16" ry="11.5" fill="#5CC06A" stroke="#2F8A3E" stroke-width="2"/>
    <ellipse cx="-2" cy="7" rx="9" ry="5.5" fill="#BDEBB9"/>
    <ellipse cx="15" cy="-7" rx="12" ry="9" fill="#5CC06A" stroke="#2F8A3E" stroke-width="2"/>
    <circle cx="18" cy="-10" r="2.6" fill="#222"/>
    <path d="M19 -3 q4 1.5 7 -1" stroke="#2F8A3E" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  if(id==='rocket') return `
    <path d="M-19 -5 Q-35 0 -19 5 Z" fill="#FFB84C"/>
    <path d="M-19 -3 Q-28 0 -19 3 Z" fill="#FFE08A"/>
    <path d="M-11 -9 L-21 -21 L-2 -10 Z" fill="#EF6F6C" stroke="#C24E4C" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-11 9 L-21 21 L-2 10 Z" fill="#EF6F6C" stroke="#C24E4C" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-18 -10 H8 Q26 -10 31 0 Q26 10 8 10 H-18 Z" fill="#EEF2FA" stroke="#7B8AB0" stroke-width="2"/>
    <path d="M18 -7.5 Q27 -5 31 0 Q27 5 18 7.5 Z" fill="#EF6F6C"/>
    <circle cx="5" cy="0" r="5.5" fill="#7FC8F8" stroke="#7B8AB0" stroke-width="2"/>`;
  if(id==='bfly') return `
    <ellipse cx="-5" cy="-13" rx="13" ry="11" fill="#C9A2F5" stroke="#8A63C9" stroke-width="2" transform="rotate(-22 -5 -13)"/>
    <ellipse cx="-5" cy="13" rx="13" ry="11" fill="#C9A2F5" stroke="#8A63C9" stroke-width="2" transform="rotate(22 -5 13)"/>
    <ellipse cx="-17" cy="-5" rx="7" ry="6" fill="#FFC6E5" stroke="#8A63C9" stroke-width="1.6"/>
    <ellipse cx="-17" cy="5" rx="7" ry="6" fill="#FFC6E5" stroke="#8A63C9" stroke-width="1.6"/>
    <circle cx="-5" cy="-14" r="3.6" fill="#FFE6F4"/><circle cx="-5" cy="14" r="3.6" fill="#FFE6F4"/>
    <ellipse cx="2" cy="0" rx="14" ry="4.5" fill="#5B4A7A"/>
    <circle cx="17" cy="0" r="5.2" fill="#5B4A7A"/>
    <path d="M20 -3 Q26 -10 30 -9 M20 3 Q26 10 30 9" stroke="#5B4A7A" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  // 默认：小猫
  return `
    <path d="M-18 6 Q-33 -2 -26 -18" stroke="#E08A00" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-12 16 v7 M3 16 v7" stroke="#C97800" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-4" cy="7" rx="17" ry="12" fill="#FFAB19" stroke="#C97800" stroke-width="2"/>
    <polygon points="1,-14 4,-28 12,-17" fill="#FFAB19" stroke="#C97800" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="13,-17 21,-27 22,-11" fill="#FFAB19" stroke="#C97800" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="11" cy="-5" r="13" fill="#FFAB19" stroke="#C97800" stroke-width="2"/>
    <ellipse cx="18" cy="0" rx="6.5" ry="4.5" fill="#FFF4E0"/>
    <circle cx="15" cy="-8" r="2.6" fill="#2D2D2D"/>
    <circle cx="23.5" cy="-1" r="2" fill="#E2627A"/>`;
}
function charSVG(id, cls=''){
  return `<svg class="${cls}" viewBox="-34 -34 68 68" xmlns="http://www.w3.org/2000/svg">${charG(id)}</svg>`;
}

/* =====================================================================
   二、Scratch 舞台示意图（看图题用）
   坐标系：Scratch 的 y 向上为正，SVG 的 y 向下为正，所以画图时 y 取反
   网格每格 60；角色按 Scratch 方向旋转：rotate(方向 - 90)
   ===================================================================== */
function stageSVG(o, cls=''){
  const ch = o.char || DB.cur || 'cat';
  let g = '';
  for(let x=-180;x<=180;x+=60) if(x) g+=`<line x1="${x}" y1="-180" x2="${x}" y2="180" class="gl"/>`;
  for(let y=-120;y<=120;y+=60) if(y) g+=`<line x1="-240" y1="${y}" x2="240" y2="${y}" class="gl"/>`;
  g += `<line x1="-240" y1="0" x2="240" y2="0" class="ax"/><line x1="0" y1="-180" x2="0" y2="180" class="ax"/>`;
  // x 轴刻度
  [[-240,'start'],[-120,'middle'],[120,'middle'],[240,'end']].forEach(([x,a])=>{
    g+=`<text x="${x===-240?-236:x===240?236:x}" y="20" text-anchor="${a}">${x}</text>`;});
  g += `<text x="6" y="20">0</text>`;
  // y 轴刻度
  [180,120,60,-60,-120,-180].forEach(y=>{
    const sy = y===180 ? -164 : y===-180 ? 174 : -y+6;
    g+=`<text x="6" y="${sy}">${y}</text>`;});
  g += `<text x="226" y="-8" style="font-style:italic;font-size:20px">x</text><text x="-22" y="-162" style="font-style:italic;font-size:20px">y</text>`;
  // 角色
  const sx = o.x||0, sy = -(o.y||0), d = (o.dir==null?90:o.dir);
  g += `<g transform="translate(${sx} ${sy}) rotate(${d-90}) scale(1.15)" opacity=".95">${charG(ch)}</g>`;
  // 方向箭头（Scratch：0°朝上，方向值增大=顺时针）
  if(o.arrow){
    const r = d*Math.PI/180, sn=Math.sin(r), cs=Math.cos(r);
    const ex = sx+70*sn, ey = sy-70*cs;
    const bx = ex-18*sn, by = ey+18*cs, px = 10*cs, py = 10*sn;
    g += `<line x1="${sx}" y1="${sy}" x2="${bx}" y2="${by}" stroke="#E0603F" stroke-width="6" stroke-linecap="round"/>
          <polygon points="${ex},${ey} ${bx+px},${by+py} ${bx-px},${by-py}" fill="#E0603F"/>`;
  }
  g += `<circle cx="${sx}" cy="${sy}" r="5" fill="#E0603F" stroke="#fff" stroke-width="2"/>`;
  return `<svg class="stage ${cls}" viewBox="-252 -192 504 384" xmlns="http://www.w3.org/2000/svg"><rect x="-240" y="-180" width="480" height="360" rx="6" class="bgR"/>${g}</svg>`;
}

/* =====================================================================

   profile = { best:{关卡号:{stars,score,frag}}, cleared:{关卡号:true}, wrong:{key:{...}}, name }
   ===================================================================== */
const KEY = 'scratchCoordAngleQuest_v1';
let DB = {cur:null, sound:true, chars:{}};
try{ const s = localStorage.getItem(KEY); if(s) DB = Object.assign(DB, JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function newProfile(){ return {best:{}, cleared:{}, wrong:{}, name:''}; }
function P(){ if(!DB.chars[DB.cur]) DB.chars[DB.cur] = newProfile(); return DB.chars[DB.cur]; }
const sum = (p,k) => Object.values(p.best).reduce((a,b)=>a+(b[k]||0),0);
const totalStars = p => sum(p,'stars');
const totalFrag  = p => sum(p,'frag');
const totalScore = p => sum(p,'score');
const clearedCount = p => Object.keys(p.cleared).length;
const allCleared = p => clearedCount(p) >= LEVELS.length;

/* =====================================================================
   五、音效（Web Audio 合成，轻柔短促，可一键开关）
   ===================================================================== */
let actx = null;
function sfx(type){
  if(!DB.sound) return;
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; actx = new AC(); }
    if(actx.state === 'suspended') actx.resume();
    const seq = {click:[[620,.06]], ok:[[660,.11],[880,.16]], bad:[[330,.12],[262,.18]],
                 win:[[523,.11],[659,.11],[784,.11],[1047,.24]]}[type] || [];
    let t = actx.currentTime + .01;
    seq.forEach(([f,d])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type==='bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.03); t += d*.9;
    });
  }catch(e){}
}
function toggleSound(){
  DB.sound = !DB.sound; save();
  document.querySelectorAll('#sndBtn').forEach(b=>b.textContent = DB.sound?'🔊':'🔇');
  if(DB.sound) sfx('click');
  toast(DB.sound ? '音效已打开' : '音效已关闭');
}

let run = null;
function startLevel(i){ run = {lvl:i, qi:0, stars:0, score:0, frag:0}; go('quiz'); }
const curQ = () => LEVELS[run.lvl].qs[run.qi];
const TYPE_NAME = q => q.stage ? '看图题' : ({tf:'判断题',choice:'选择题',fill:'填空题'}[q.t]) + (run.lvl>=7 ? ' · 推理' : '');
function rightText(q){ return q.t==='choice' ? q.opts[q.a] : q.t==='tf' ? (q.a?'对':'错') : String(q.a); }

function renderQuiz(){
  const L = LEVELS[run.lvl], q = curQ(), n = L.qs.length;
  run.tries = 0; run.locked = false; run.input = '';
  if(q.t==='choice') run.opts = shuffle(q.opts.map((t,k)=>({t, ok:k===q.a})));
  else if(q.t==='tf') run.opts = [{t:'✔ 对',v:'对',ok:q.a===true},{t:'✘ 错',v:'错',ok:q.a===false}];
  let ans = '';
  if(q.t==='fill'){
    ans = `<div class="fillBox"><div class="fillShow" id="fillShow">?</div></div>
      <div class="keypad">${[1,2,3,'−',4,5,6,'⌫',7,8,9,'C'].map(k=>`<button class="key ${isNaN(k)?'fn':''}" onclick="keyIn('${k}')">${k}</button>`).join('')}
      <button class="key" style="grid-column:span 2" onclick="keyIn('0')">0</button>
      <button class="key go" style="grid-column:span 2" onclick="submitFill()">确定 ✓</button></div>`;
  }else{
    ans = `<div class="opts ${q.t==='tf'?'two':''}">${run.opts.map((o,k)=>`<button class="opt" id="op${k}" onclick="answer(${k})">${o.t}</button>`).join('')}</div>`;
  }
  app.innerHTML = header(`第${run.lvl+1}站 · ${L.name}`) + `
    <div class="qhead">${charSVG(DB.cur,'ava')}<div class="bubble" id="say">${run.qi===0?'出发！第一题来啦～':'继续加油，下一题！'}</div></div>
    <div class="prog"><i style="width:${run.qi/n*100}%"></i></div>
    <div class="qmeta"><span>第 ${run.qi+1} / ${n} 题</span><span>⭐ ${run.stars}　🧩 ${run.frag}　🏆 ${run.score}</span></div>
    <div class="card"><span class="qtag">${TYPE_NAME(q)}</span><div class="qtext">${q.q}</div>${q.stage?stageSVG(q.stage):''}</div>
    ${ans}<div class="spacer"></div>`;
}
// 填空：屏幕数字键盘（iPhone 自带数字键盘没有负号，所以自制）
function keyIn(k){
  if(run.locked) return; sfx('click');
  let s = run.input;
  if(k==='⌫') s = s.slice(0,-1);
  else if(k==='C') s = '';
  else if(k==='−') s = s.startsWith('-') ? s.slice(1) : '-' + s;
  else if(s.replace('-','').length < 4) s = (s==='0'?'':s==='-0'?'-':s) + k;
  run.input = s;
  const f = document.getElementById('fillShow'); f.textContent = s || '?'; f.className = 'fillShow';
}
function answer(k){
  if(run.locked) return; const o = run.opts[k];
  if(o.ok){ document.getElementById('op'+k).classList.add('good'); onRight(); }
  else { const b = document.getElementById('op'+k); b.classList.add('bad'); b.disabled = true; onWrong(o.v || o.t); }
}
function submitFill(){
  if(run.locked) return;
  if(run.input==='' || run.input==='-'){ toast('先用下面的键盘输入数字哦'); return; }
  const v = parseInt(run.input,10), f = document.getElementById('fillShow');
  if(v === curQ().a){ f.className='fillShow good'; onRight(); }
  else { f.className='fillShow bad'; onWrong(String(v)); }
}
function animAva(cls){
  const a = document.querySelector('.qhead .ava'); if(!a) return;
  a.classList.remove('happy','sad'); void a.getBoundingClientRect(); a.classList.add(cls);
}
function showSheet(html){
  sheet.innerHTML = html; sheet.classList.add('show');
  requestAnimationFrame(()=>document.documentElement.style.setProperty('--sheetH', sheet.offsetHeight+10+'px'));
}
// 答对：第一次答对 +1⭐ +10分；改正后答对 +5分；答对都 +1🧩
function onRight(){
  run.locked = true; const q = curQ(), first = run.tries===0;
  if(first){ run.stars++; run.score += 10; } else run.score += 5;
  run.frag++;
  sfx('ok'); animAva('happy');
  document.getElementById('say').textContent = first ? pick(OK_LINES) : pick(RE_LINES);
  const last = run.qi === LEVELS[run.lvl].qs.length-1;
  showSheet(`<div class="ok"><div class="sh">${charSVG(DB.cur,'happy')}<div><h3>${first?pick(OK_LINES):pick(RE_LINES)}</h3>
    <div class="gain">${first?'⭐ +1　':''}🧩 +1　🏆 +${first?10:5}</div></div></div>
    <div class="exp">📖 ${q.exp}</div>
    <button class="btn ok" onclick="nextQ()">${last?'查看闯关结果 🎯':'下一题 ▶'}</button></div>`);
}
// 答错：第1次给提示（不给答案）可重试；第2次给出完整解析和正确答案
function onWrong(userAns){
  run.tries++; const q = curQ(), p = P();
  if(run.tries===1){ p.wrong[run.lvl+'-'+run.qi] = {lvl:run.lvl, qi:run.qi, your:userAns, t:Date.now()}; save(); }
  sfx('bad'); animAva('sad');
  document.getElementById('say').textContent = pick(BAD_LINES);
  if(run.tries===1){
    showSheet(`<div><div class="sh">${charSVG(DB.cur,'sad')}<div><h3>${pick(BAD_LINES)}</h3></div></div>
      <div class="exp hint">💡 想一想：${q.hint}</div>
      <button class="btn pri" onclick="retry()">再试一次 💪</button></div>`);
  }else{
    run.locked = true;
    if(q.t!=='fill') run.opts.forEach((o,k)=>{ if(o.ok) document.getElementById('op'+k).classList.add('good'); });
    const last = run.qi === LEVELS[run.lvl].qs.length-1;
    showSheet(`<div><div class="sh">${charSVG(DB.cur)}<div><h3>我们一起来看看 Scratch 的规则</h3><div class="gain">正确答案：${rightText(q)}</div></div></div>
      <div class="exp">📖 ${q.exp}</div><p class="tip">这道题已放进📒错题本，之后可以再复习～</p>
      <button class="btn pri" onclick="nextQ()">${last?'查看闯关结果 🎯':'下一题 ▶'}</button></div>`);
  }
}
function retry(){
  sfx('click'); hideSheet();
  if(curQ().t==='fill'){ run.input=''; const f=document.getElementById('fillShow'); f.textContent='?'; f.className='fillShow'; }
  document.getElementById('say').textContent = '仔细想想提示，再选一次～';
}
function nextQ(){
  sfx('click'); hideSheet(); run.qi++;
  if(run.qi >= LEVELS[run.lvl].qs.length) finishLevel(); else { window.scrollTo(0,0); renderQuiz(); }
}

/* =====================================================================
   十一、关卡结算：星星达标解锁下一关 + 颁发徽章
   每关记录最好成绩（星星/分数/碎片取最高），防止反复刷分
   ===================================================================== */
function finishLevel(){
  const p = P(), i = run.lvl, b = p.best[i] || {stars:0,score:0,frag:0};
  p.best[i] = {stars:Math.max(b.stars,run.stars), score:Math.max(b.score,run.score), frag:Math.max(b.frag,run.frag)};
  const passed = run.stars >= PASS, newly = passed && !p.cleared[i];
  if(passed) p.cleared[i] = true;
  save(); go('result', {passed, newly});
}
function renderResult(r){
  const L = LEVELS[run.lvl], n = L.qs.length, p = P(), i = run.lvl;
  const finale = r.newly && allCleared(p);
  sfx(r.passed ? 'win' : 'bad');
  let stars = ''; for(let k=0;k<n;k++) stars += `<span class="${k<run.stars?'':'off'}">⭐</span>`;
  app.innerHTML = header('闯关结果') + `
    <div class="card" style="text-align:center">
      ${charSVG(DB.cur, 'bigAva '+(r.passed?'happy':'sad'))}
      <h2 style="margin:6px 0;color:${r.passed?'var(--ok)':'var(--pri)'}">${r.passed?'🎉 闯关成功！':'差一点点就成功啦！'}</h2>
      <div class="resStars">${stars}</div>
      <p class="lead">本次获得 ⭐${run.stars}　🧩${run.frag}　🏆${run.score}<br>
      ${r.passed ? (i<LEVELS.length-1 ? '下一站已经解锁！' : '你已完成最后一站！') : `需要 ${PASS} 颗星才能通关，看看错题本再来挑战吧！`}</p>
    </div>
    ${r.newly ? `<div class="newBadge"><div class="bi">${L.bIcon}</div><b style="font-size:19px">获得徽章：${L.badge}</b><div class="tip">已收进徽章图鉴</div></div>` : ''}
    ${finale ? `<button class="btn sun big" onclick="go('poster')">🏆 编程水晶拼好啦！查看通关海报</button>` : ''}
    ${r.passed && i<LEVELS.length-1 && !finale ? `<button class="btn pri big" onclick="openIntro(${i+1})">下一站 ▶</button>` : ''}
    <div class="row2"><button class="btn" onclick="startLevel(${i})">🔁 再挑战</button><button class="btn" onclick="go('map')">🗺️ 地图</button></div>
    <button class="btn small" onclick="go('wrong')">📒 看看错题本</button>`;
}

/* =====================================================================
   十二、错题本：回看题目、你的答案、正确答案与解析
   ===================================================================== */
function renderWrong(){
  const p = P(), list = Object.entries(p.wrong).sort((a,b)=>b[1].t-a[1].t);
  let html = header('📒 错题本') + `<p class="lead">${CHARS[DB.cur].name}的错题共 <b>${list.length}</b> 道。弄懂了就点“我学会了”！</p>`;
  if(!list.length) html += `<div class="card" style="text-align:center">${charSVG(DB.cur,'bigAva bob')}<p class="lead">还没有错题，太厉害啦！</p></div>`;
  list.forEach(([key,w])=>{
    const L = LEVELS[w.lvl], q = L.qs[w.qi];
    html += `<div class="card wcard"><div class="wh">第${w.lvl+1}站 · ${L.name} · 第${w.qi+1}题</div>
      <div class="wq">${q.q}</div>${q.stage?stageSVG(q.stage):''}
      ${q.t==='choice'?`<div class="tip" style="text-align:left">选项：${q.opts.join(' ／ ')}</div>`:''}
      <div class="wa">你的答案：<b class="w">${w.your}</b>　正确答案：<b class="r">${rightText(q)}</b></div>
      <div class="exp">📖 ${q.exp}</div>
      <button class="btn small" onclick="learned('${key}')">✅ 我学会了</button></div>`;
  });
  if(list.length) html += `<button class="btn small" onclick="confirmBox('要清空全部错题吗？',clearWrong)">🗑 清空错题本</button>`;
  html += `<button class="btn" onclick="go('map')">🗺️ 返回地图</button>`;
  app.innerHTML = html;
}
function learned(key){ sfx('ok'); delete P().wrong[key]; save(); renderWrong(); }
function clearWrong(){ P().wrong = {}; save(); renderWrong(); }

/* =====================================================================
   十三、徽章图鉴
   ===================================================================== */
function openBadges(){
  sfx('click');
  if(!DB.cur){ toast('先选一个探险角色吧！'); go('select'); return; }
  const p = P();
  openModal(`<h2>🏅 徽章图鉴</h2><p class="tip">${CHARS[DB.cur].name}已收集 ${clearedCount(p)} / ${LEVELS.length} 枚</p>
    <div class="badgeGrid">${LEVELS.map((L,i)=>`<div class="badge ${p.cleared[i]?'':'lock'}"><div class="bi">${p.cleared[i]?L.bIcon:'❔'}</div>
      <b>${L.badge}</b><small>第${i+1}站 ${L.name}</small></div>`).join('')}</div>
    <button class="btn" onclick="closeModal()">关闭</button>`);
}

/* =====================================================================
   十四、通关海报
   ===================================================================== */
function renderPoster(){
  const p = P(); sfx('win');
  app.innerHTML = header('通关海报') + `
  <div class="poster">
    <div style="font-size:40px">💎</div>
    <h2>编程水晶修好啦！</h2>
    <p class="lead" style="margin:4px 0">${CHARS[DB.cur].name}和你一起闯过了全部 9 个探险站</p>
    ${charSVG(DB.cur,'bigAva bob')}
    <div class="pstat"><span>⭐ ${totalStars(p)}</span><span>🧩 ${totalFrag(p)}</span><span>🏆 ${totalScore(p)}</span></div>
    <div class="badgeGrid">${LEVELS.map(L=>`<div class="badge" style="background:#fff"><div class="bi">${L.bIcon}</div><b>${L.badge}</b></div>`).join('')}</div>
  </div>
  <button class="btn sun big" onclick="go('cert')">📜 生成我的通关奖状</button>
  <div class="row2"><button class="btn" onclick="openBadges()">🏅 徽章图鉴</button><button class="btn" onclick="go('map')">🗺️ 地图</button></div>`;
}

/* =====================================================================
   十五、电子奖状：Canvas 绘制成图片（可长按保存），并可直接打印
   ===================================================================== */
function renderCert(){
  const p = P();
  app.innerHTML = header('通关奖状') + `
  <div class="card"><label style="font-weight:700">写上你的名字：</label>
    <input class="input" id="kidName" maxlength="8" placeholder="例如：小明" value="${(p.name||'').replace(/"/g,'')}">
    <button class="btn pri" onclick="drawCert()">✨ 生成奖状</button></div>
  <img id="certImg" alt="通关奖状">
  <p class="tip">📱 长按奖状图片可以“存储到照片”</p>
  <button class="btn sun big" onclick="printCert()">🖨 打印奖状</button>
  <p class="tip">如果点打印没有反应：长按奖状图片 →「存储到照片」，再到「照片」App 里点分享 →「打印」。</p>
  <button class="btn" onclick="go('poster')">返回海报</button>`;
  drawCert();
}
function rr(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function star(x,cx,cy,r,col){ x.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*.45:r; x.lineTo(cx+rr2*Math.cos(a), cy+rr2*Math.sin(a)); } x.closePath(); x.fillStyle=col; x.fill(); }
function wrapText(x, text, X, Y, maxW, lh){
  let line = '', y = Y;
  for(const ch of text){ if(x.measureText(line+ch).width > maxW){ x.fillText(line, X, y); line = ch; y += lh; } else line += ch; }
  if(line) x.fillText(line, X, y); return y;
}
function drawCert(){
  const p = P(), c = DB.cur, inp = document.getElementById('kidName');
  const name = (inp && inp.value.trim()) || '小小探险家';
  p.name = inp && inp.value.trim() ? name : p.name; save();
  const W = 1000, H = 1414, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'), F = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  // 背景与边框
  x.fillStyle = '#FFFBF0'; x.fillRect(0,0,W,H);
  rr(x,28,28,W-56,H-56,36); x.lineWidth = 18; x.strokeStyle = '#7C6BD6'; x.stroke();
  x.setLineDash([16,12]); rr(x,62,62,W-124,H-124,26); x.lineWidth = 5; x.strokeStyle = '#FFC24B'; x.stroke(); x.setLineDash([]);
  [[100,100],[W-100,100],[100,H-100],[W-100,H-100]].forEach(([a,b])=>star(x,a,b,26,'#FFC24B'));
  // 标题
  x.textAlign = 'center'; x.fillStyle = '#E0603F'; x.font = `bold 110px ${F}`; x.fillText('奖　状', W/2, 240);
  x.fillStyle = '#7C6BD6'; x.font = `bold 38px ${F}`; x.fillText('Scratch 坐标与角度探险 · 全部通关', W/2, 310);
  // 正文
  x.textAlign = 'left'; x.fillStyle = '#3D3A4B'; x.font = `bold 52px ${F}`; x.fillText(name + ' 小朋友：', 120, 420);
  x.font = `38px ${F}`;
  const body = `　　你和探险伙伴「${CHARS[c].name}」一起闯过了 Scratch 舞台王国全部 9 个探险站，认识了舞台坐标、学会了方向角度，修好了编程水晶！共获得 ${totalStars(p)} 颗星星、${totalFrag(p)} 枚编程碎片、9 枚编程徽章。特发此状，以资鼓励！`;
  wrapText(x, body, 120, 500, 760, 64);
  // 星星数据条
  const yS = 1080;
  [['星星',totalStars(p)],['碎片',totalFrag(p)],['徽章',9]].forEach(([t,v],k)=>{
    const bx = 130 + k*250; rr(x,bx,yS-60,220,96,24); x.fillStyle = ['#FFF1CC','#EEEAFE','#E3F6EC'][k]; x.fill();
    star(x,bx+46,yS-12,24,['#FFB443','#9C8DF0','#43B07A'][k]);
    x.fillStyle = '#3D3A4B'; x.font = `bold 34px ${F}`; x.textAlign = 'left'; x.fillText(t+' '+v, bx+82, yS);
  });
  // 落款 + 日期 + 圆形印章
  const d = new Date();
  x.textAlign = 'right'; x.fillStyle = '#3D3A4B'; x.font = `bold 34px ${F}`;
  x.fillText('Scratch 舞台王国 · 探险委员会', W-120, 1230);
  x.font = `32px ${F}`; x.fillText(`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`, W-120, 1285);
  x.save(); x.globalAlpha = .85; x.beginPath(); x.arc(240,1250,78,0,Math.PI*2); x.lineWidth = 7; x.strokeStyle = '#E0603F'; x.stroke();
  x.fillStyle = '#E0603F'; x.textAlign = 'center'; x.font = `bold 34px ${F}`; x.fillText('通关', 240, 1240); x.fillText('认证', 240, 1282);
  star(x,240,1195,12,'#E0603F'); x.restore();
  // 角色头像（SVG 转图片后绘制；失败则跳过，不影响奖状）
  const finish = ()=>{
    let url = '';
    try{ url = cv.toDataURL('image/png'); }catch(e){}
    const img = document.getElementById('certImg'); if(img && url) img.src = url;
    document.getElementById('printImg').src = url;
  };
  x.beginPath(); x.arc(W/2, 860, 150, 0, Math.PI*2); x.fillStyle = '#EEEAFE'; x.fill();
  x.lineWidth = 8; x.strokeStyle = '#fff'; x.stroke();
  const im = new Image();
  im.onload = ()=>{ try{ x.drawImage(im, W/2-140, 860-140, 280, 280); }catch(e){} finish(); };
  im.onerror = finish;
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="-34 -34 68 68">${charG(c)}</svg>`);
}
function printCert(){
  sfx('click');
  const src = document.getElementById('printImg').src;
  if(!src){ toast('奖状还在生成，请稍等一下～'); return; }
  setTimeout(()=>window.print(), 100);
}

/* =====================================================================
   十六、页面路由表 & 启动
   ===================================================================== */
const SCREENS = {home:renderHome, select:renderSelect, map:renderMap, quiz:renderQuiz,
                 result:renderResult, wrong:renderWrong, poster:renderPoster, cert:renderCert};
// iOS 需要用户点击后才能播放声音：首次触摸时解锁音频
document.addEventListener('touchstart', function unlock(){ if(DB.sound){ sfx('click'); } document.removeEventListener('touchstart', unlock); }, {passive:true});
go('home');

/* 注册离线缓存（只在 https 网站上生效；直接打开本地文件时自动跳过） */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(()=>{}));
}
